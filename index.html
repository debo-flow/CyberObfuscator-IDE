        const Pipeline = {
            transforms: [],
            state: [],
            init() {
                Bus.on('compile-start', (seq) => {
                    this.state.forEach(t => {
                        if (seq.includes(t.id)) { t.status = 'READY'; t.order = seq.indexOf(t.id); }
                        else { t.status = 'SKIPPED'; t.order = undefined; }
                        t.stats = null;
                    });
                    this.render();
                });
                Bus.on('compile-error', () => {
                    this.state.forEach(t => { if(t.status === 'RUNNING') t.status = 'FAILED'; });
                    this.render();
                });
                Bus.on('pass-start', (id) => {
                    let t = this.state.find(x => x.id === id);
                    if (t) { t.status = 'RUNNING'; this.render(); }
                });
                Bus.on('pass-end', (data) => {
                    let t = this.state.find(x => x.id === data.id);
                    if (t) { t.status = data.status; t.stats = data.stats; this.render(); }
                });
            },
            render() {
                if(this.state.length===0) {
                    if (App && App.compiler) {
                        this.transforms = Array.from(App.compiler.passes.values()).map(p => ({
                            id: p.id, title: p.name, desc: p.description, def: p.enabled, status: 'READY'
                        }));
                    }
                    this.state = this.transforms.map(t=>({...t, enabled:t.def}));
                }
                const list = document.getElementById('pipe-list'); if(!list) return; list.innerHTML = '';
                
                this.state.forEach(t => {
                    let passDef = App.compiler ? App.compiler.passes.get(t.id) : null;
                    if(!passDef) return;
                    
                    let badges = `<span class="badge-phase">${passDef.phase}</span>`;
                    if (passDef.dependencies.length) badges += `<span class="badge-dep">Deps: ${passDef.dependencies.join(', ')}</span>`;
                    if (passDef.conflicts.length) badges += `<span class="badge-err">Conflicts: ${passDef.conflicts.join(', ')}</span>`;
                    
                    let statusColors = {
                        'READY': 'var(--text-muted)', 'RUNNING': 'var(--accent-cyan)', 'COMPLETE': 'var(--accent-green)',
                        'WARNING': 'var(--accent-yellow)', 'FAILED': 'var(--accent-magenta)', 'SKIPPED': 'var(--text-secondary)'
                    };
                    let sColor = statusColors[t.status] || statusColors['READY'];
                    let statusLabel = `<span style="color:${sColor}; font-weight:600; font-size:0.65rem; margin-right:0.4rem;">[${t.status || 'READY'}]</span>`;
                    
                    let orderLabel = (t.order !== undefined && t.status !== 'SKIPPED' && t.enabled) ? `<span style="font-family:var(--font-mono); color:var(--accent-cyan); font-size:0.65rem; margin-right:0.4rem;">#${t.order+1}</span>` : '';

                    let statsHtml = '';
                    if (t.stats) {
                        const time = t.stats.time.toFixed(1) + 'ms';
                        const dn = t.stats.deltas && t.stats.deltas.nodes > 0 ? '+'+t.stats.deltas.nodes : (t.stats.deltas ? t.stats.deltas.nodes : 0);
                        const cng = `${t.stats.modifications} changes`;
                        
                        statsHtml = `<div style="display:flex; gap:0.8rem; font-size:0.65rem; font-family:var(--font-mono); margin-top:0.4rem; padding-top:0.4rem; border-top:1px dashed rgba(255,255,255,0.05);">
                            <span style="color:var(--accent-yellow)">⏱ ${time}</span>
                            <span style="color:var(--accent-cyan)">ΔNd: ${dn}</span>
                            <span style="color:var(--text-secondary)">✎ ${cng}</span>`;
                            
                        if (t.stats.warnings && t.stats.warnings.length) statsHtml += `<span style="color:var(--accent-yellow)">⚠ ${t.stats.warnings.length} warns</span>`;
                        if (t.stats.errors && t.stats.errors.length) statsHtml += `<span style="color:var(--accent-magenta)">✖ ${t.stats.errors.length} errs</span>`;
                        statsHtml += `</div>`;
                    }

                    const el = document.createElement('div'); 
                    el.className='list-item'; 
                    el.style.border = `1px solid ${t.status === 'RUNNING' ? 'var(--accent-cyan)' : 'transparent'}`; 
                    el.style.background = t.status === 'RUNNING' ? 'rgba(0, 240, 255, 0.05)' : '';
                    el.style.flexDirection = 'column';
                    el.style.alignItems = 'stretch';
                    el.dataset.id = t.id;
                    
                    el.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                            <span style="cursor:grab; padding-right:0.5rem; color:var(--text-muted);" class="dh">${UI.icon('grip-vertical')}</span>
                            <div style="flex:1; display:flex; flex-direction:column; gap:0.2rem;">
                                <div style="display:flex; align-items:center; flex-wrap:wrap; gap:0.3rem;">
                                    ${orderLabel}${statusLabel}<span style="font-weight:500; color:${t.enabled?'var(--text-primary)':'var(--text-secondary)'}; margin-right:0.5rem;">${t.title}</span> ${badges}
                                </div>
                                <div style="font-size:0.65rem; color:var(--text-muted); line-height:1.2;">${t.desc}</div>
                            </div>
                            <label class="toggle-switch" style="margin-left:0.5rem;">
                                <input type="checkbox" class="t-cb" ${t.enabled?'checked':''} onchange="App.pipeline.sync()">
                                <span class="slider"></span>
                            </label>
                        </div>
                        ${statsHtml}
                    `;
                    list.appendChild(el);
                });
                if(typeof Sortable !== 'undefined') new Sortable(list, {handle:'.dh', animation:150, onEnd:()=>this.sync()});
                if(typeof lucide !== 'undefined') lucide.createIcons({root: list});
            },
            sync() {
                const list = document.getElementById('pipe-list'); if(!list) return;
                const next = []; Array.from(list.children).forEach(n => { const id = n.dataset.id; const orig = this.transforms.find(x=>x.id===id); next.push({...orig, enabled:n.querySelector('.t-cb').checked}); });
                this.state = next; document.getElementById('preset-sel').value = 'custom';
            },
            applyPreset(v) {
                const map = { low:['rename-identifiers','minify'], balanced:['rename-identifiers','string-pooling','number-encoding','boolean-encoding','control-flow','minify'], extreme:this.transforms.map(t=>t.id) };
                if(map[v]) { this.state = this.transforms.map(t=>({...t, enabled:map[v].includes(t.id)})); this.render(); }
            },
            validate() {
                if(!App.compiler) return;
                let activePasses = this.state.filter(t => t.enabled).map(t => App.compiler.passes.get(t.id)).filter(Boolean);
                
                // Add Dynamic Workspaces Plugins to validation scope
                App.ws.files.forEach((f,n) => {
                    if (n.endsWith('.plugin.js')) {
                        activePasses.push(new TransformationPass({id: `custom-${n.replace(/[^a-zA-Z0-9-]/g, '')}`, name: n, phase: PassPhases.TRANSFORM, enabled: true}));
                    }
                });

                // Check Duplicates
                const counts = {};
                const duplicates = [];
                activePasses.forEach(p => { counts[p.id] = (counts[p.id] || 0) + 1; if(counts[p.id] > 1 && !p.repeatable) duplicates.push(p.name); });
                
                // Active Language Validation (Simulated against active file context)
                const actFile = App.ws.files.get(App.ws.active);
                const actLang = actFile ? actFile.lang : 'javascript';
                const unsupLangs = activePasses.filter(p => p.supportedLangs && !p.supportedLangs.includes(actLang)).map(p => `'${p.name}' does not support ${actLang}`);

                const activeIds = new Set(activePasses.map(p => p.id));
                let missingDeps = [];
                activePasses.forEach(p => {
                    if (p.dependencies) p.dependencies.forEach(d => { if (!activeIds.has(d)) missingDeps.push(`'${p.name}' requires '${d}' which is disabled.`); });
                });

                const plan = App.compiler.planExecution(activePasses, this.state);
                let hasErrors = !plan.success || missingDeps.length > 0 || duplicates.length > 0 || unsupLangs.length > 0;
                
                let html = '';
                if (hasErrors) {
                    html += `<h4 style="color:var(--accent-magenta); margin-bottom:0.5rem;">Validation Errors</h4><ul style="margin-left:1.5rem;color:var(--accent-magenta);font-size:0.85rem; margin-bottom:1rem;">`;
                    missingDeps.forEach(e => html += `<li>Missing Dependency: ${e}</li>`);
                    duplicates.forEach(e => html += `<li>Duplicate Pass: '${e}' is active multiple times and is not marked repeatable.</li>`);
                    unsupLangs.forEach(e => html += `<li>Unsupported Context: ${e}</li>`);
                    plan.errors.forEach(e => html += `<li>${e}</li>`);
                    html += `</ul>`;
                }
                
                if (plan.warnings.length > 0) {
                    html += `<h4 style="color:var(--accent-yellow); margin-bottom:0.5rem;">Planner Warnings</h4><ul style="margin-left:1.5rem;color:var(--accent-yellow);font-size:0.85rem; margin-bottom:1rem;">`;
                    plan.warnings.forEach(w => html += `<li>${w}</li>`);
                    html += `</ul>`;
                }
                
                if (!hasErrors && plan.warnings.length === 0) {
                    html += `<div style="color:var(--accent-green); padding: 0.5rem; background: rgba(16, 185, 129, 0.1); border-radius: 4px; margin-bottom:1rem; border:1px solid rgba(16, 185, 129, 0.3);"><i data-lucide="check-circle" style="display:inline-block; vertical-align:middle; width:16px;"></i> Pipeline configuration is valid. No conflicts or missing dependencies detected.</div>`;
                }

                html += `<h4 style="border-bottom:1px solid var(--border-dim); padding-bottom:0.5rem; margin-bottom:0.5rem;">Calculated Execution Order</h4>`;
                if (plan.sequence.length === 0) {
                    html += `<div style="color:var(--text-muted); font-size:0.85rem;">No passes enabled.</div>`;
                } else {
                    html += `<div style="display:flex; flex-direction:column; gap:0.4rem; max-height:200px; overflow-y:auto; padding-right:0.5rem;">`;
                    plan.sequence.forEach((p, i) => {
                        html += `<div style="display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; padding:0.4rem 0.6rem; background:var(--bg-hover); border-radius:4px; border-left: 2px solid var(--accent-cyan);">
                            <span><span style="color:var(--text-muted); font-family:var(--font-mono); margin-right:0.5rem;">[${(i+1).toString().padStart(2, '0')}]</span> ${p.name}</span>
                            <span class="badge-phase">${p.phase}</span>
                        </div>`;
                    });
                    html += `</div>`;
                }

                UI.modal('Pipeline Inspector', html, [{text: 'Close', cb: () => true}]);
            }
        };

        const Dashboard = {
            init() { Bus.on('build-done', (s)=>this.update(s)); },
            update(stats) {
                const c = document.getElementById('dash-grid'); if(!c) return;
                const ratio = Math.min((stats.outSize/(stats.srcSize||1))*50, 100);
                const score = Math.min((stats.nodes/(stats.srcSize||1))*10, 100).toFixed(1);
                c.innerHTML = `
                    <div class="stat-card"><div style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase;">Source Size</div><div style="font-size:1.5rem; font-family:var(--font-mono); color:var(--accent-cyan);">${UI.bytes(stats.srcSize)}</div></div>
                    <div class="stat-card"><div style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase;">Output Size</div><div style="font-size:1.5rem; font-family:var(--font-mono); color:var(--accent-magenta);">${UI.bytes(stats.outSize)}</div><div style="height:4px; background:rgba(255,255,255,0.1); margin-top:0.5rem;"><div style="height:100%; width:${ratio}%; background:var(--accent-magenta);"></div></div></div>
                    <div class="stat-card"><div style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase;">AST Nodes</div><div style="font-size:1.5rem; font-family:var(--font-mono); color:var(--accent-cyan);">${stats.nodes}</div></div>
                    <div class="stat-card"><div style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase;">Build Time</div><div style="font-size:1.5rem; font-family:var(--font-mono); color:var(--accent-yellow);">${stats.time.toFixed(0)} ms</div></div>
                    <div class="stat-card" style="grid-column: 1 / -1;"><div style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase;">Protection Score</div><div style="font-size:1rem; margin-top:0.5rem;">${score} / 100</div><div style="height:4px; background:rgba(255,255,255,0.1); margin-top:0.5rem;"><div style="height:100%; width:${score}%; background:var(--accent-green);"></div></div></div>
                `;
            }
        };

        const Plugins = {
            createBoilerplate() { App.ws.addFile(`custom_${Date.now()}.plugin.js`, `// @name CustomPlugin\nreturn function(babel) {\n  return { visitor: {\n    StringLiteral(path) {\n       if(path.node.value.length > 2) path.node.value = path.node.value.toUpperCase();\n    }\n  }};\n};`, true); App.layout.openPanel('explorer'); },
            render() {
                const c = document.getElementById('plugin-list'); if(!c) return; c.innerHTML='';
                let count=0;
                App.ws.files.forEach((f,n)=>{
                    if(!n.endsWith('.plugin.js')) return; count++;
                    let meta = {name:n, v:'1.0'}; const mName = f.content.match(/\/\/\s*@name\s+(.*)/); if(mName) meta.name=mName[1];
                    const el = document.createElement('div'); el.className='list-item'; el.style.border='1px solid var(--border-dim)';
                    el.innerHTML = `<div><div style="color:var(--accent-yellow); font-weight:600;">${meta.name}</div><div style="font-size:0.7rem; color:var(--text-secondary);">File: ${n} | Priority: User Dynamic</div></div>`;
                    c.appendChild(el);
                });
                if(count===0) c.innerHTML='<div style="padding:1rem; color:var(--text-muted);">No custom plugins found.</div>';
            }
        };

        class Application {
            constructor() {
                this.ws = new WorkspaceEngine(); 
                this.compiler = new CompilerEngine();
                
                this.editor = new EditorEngine(); this.term = new TerminalEngine();
                this.layout = new AppLayout(); this.pipeline = Pipeline;
                this.dash = Dashboard; this.plugins = Plugins; 
                this.explorer = Explorer;
                
                this.cmd = {
                    show: () => { const p = document.getElementById('cmd-palette'); p.classList.add('active'); document.getElementById('cmd-input').focus(); this.renderCmd(); },
                    hide: () => document.getElementById('cmd-palette').classList.remove('active'),
                    renderCmd: () => {
                        const q = document.getElementById('cmd-input').value.toLowerCase();
                        const cmds = [ {t:'Compile Workspace', f:()=>App.compile()}, {t:'Create Plugin', f:()=>App.plugins.createBoilerplate()} ];
                        document.getElementById('cmd-list').innerHTML = cmds.filter(c=>c.t.toLowerCase().includes(q)).map((c,i) => `<div class="list-item" onclick="App.cmd.exec(${i})">${c.t}</div>`).join('');
                        this._cmds = cmds;
                    },
                    exec: (i) => { if(this._cmds[i]) { this._cmds[i].f(); this.cmd.hide(); } }
                };
            }

            async init() {
                try { await this.editor.init(); } catch(e) {}
                this.pipeline.init();
                
                const loaded = await this.ws.load();
                if(!loaded) {
                    this.ws.addFile('main.js', `function calculateFibonacci(n) {\n  let a = 0, b = 1, temp;\n  while (n >= 0) {\n    temp = a;\n    a = a + b;\n    b = temp;\n    n--;\n  }\n  return b;\n}\nconsole.log("Result: ", calculateFibonacci(10));`, true, false);
                }
                
                document.getElementById('cmd-input').addEventListener('input', this.cmd.renderCmd);
                document.addEventListener('keydown', e => { if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='p') { e.preventDefault(); this.cmd.show(); } else if(e.ctrlKey && e.key==='Enter') { e.preventDefault(); this.compile(); } });
                document.addEventListener('click', e => { const p = document.getElementById('cmd-palette'); if(p.classList.contains('active') && !p.contains(e.target) && !e.target.closest('[title="Command Palette (Ctrl+Shift+P)"]')) this.cmd.hide(); });
                
                setInterval(() => this.ws.autoSave(), 15000);
                UI.log('Enterprise IDE Ready. Multi-Pass Engine Online.', 'success');
                
                if(typeof Babel === 'undefined') {
                    UI.log('CRITICAL: Babel compiler is missing!', 'error');
                    UI.log('Your Android HTML Viewer is blocking internet connection.', 'warn');
                    UI.log('Solution: Open this HTML file using Google Chrome.', 'warn');
                    UI.toast('Compiler Offline', 'error');
                }
            }

            async compile() {
                if(typeof Babel === 'undefined') {
                    UI.log('Cannot compile: Babel compiler is blocked. Open in Chrome.', 'error');
                    return UI.toast('Compiler Offline', 'error');
                }
                
                if(this.ws.files.size===0) return UI.toast('Workspace empty.', 'warn');
                
                const cfg = this.pipeline.state; const customPlugins = []; const srcFiles = [];
                let totSrc=0, totOut=0, totNodes=0, totTime=0;
                
                let extStats = {
                    totalPasses: 0, successfulPasses: 0, skippedPasses: 0, failedPasses: 0,
                    totalTransformations: 0, totalAstChanges: 0,
                    analysisTime: 0, transformationTime: 0, validationTime: 0, generationTime: 0
                };

                App.ws.files.forEach((f,n) => { if(n.endsWith('.plugin.js')) customPlugins.push({name:n, code:f.content}); else { srcFiles.push({n,f}); totSrc+=f.content.length; } });
                UI.log(`Build started (${srcFiles.length} files)...`, 'system');
                
                let buildFailed = false;

                for(let {n,f} of srcFiles) {
                    try {
                        const r = await this.compiler.execute(f.content, f.lang, cfg, customPlugins, n);
                        f.output = r.code; 
                        
                        f.astState = r.astState;
                        f.inAst = r.astState.originalAst;
                        f.outAst = r.astState.transformedAst;
                        
                        totOut += r.code.length; 
                        totNodes += r.astState.currentNodesCount;
                        totTime += r.time;
                        
                        const st = r.astState.statistics;
                        extStats.totalPasses += st.totalPasses;
                        extStats.successfulPasses += st.successfulPasses;
                        extStats.skippedPasses += st.skippedPasses;
                        extStats.failedPasses += st.failedPasses;
                        extStats.totalTransformations += st.modifications;
                        extStats.totalAstChanges += st.modifications; 
                        extStats.analysisTime += st.analysisTime;
                        extStats.transformationTime += st.transformationTime;
                        extStats.validationTime += st.validationTime;
                        extStats.generationTime += st.generationTime;

                        this.editor.syncOutput(n);
                        UI.log(`✓ Compiled: ${n}`, 'success');
                    } catch(e) { 
                        UI.log(`Error in ${n}: ${e.message}`, 'error'); 
                        buildFailed = true;
                    }
                }
                
                const stats = { srcSize:totSrc, outSize:totOut, nodes:totNodes, time:totTime, ...extStats };
                Bus.emit('build-done', stats);
                Bus.emit('fs-change');
                
                if (buildFailed) {
                    UI.log(`✕ Build Completed with Errors`, 'error'); 
                    UI.toast('Build Failed', 'error');
                } else {
                    UI.log(`✓ Build Complete (${totTime.toFixed(0)}ms)`, 'success'); 
                    UI.toast('Build Successful', 'success');
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => { window.App = new Application(); window.App.init(); });
    </script>
</body>
</html>
