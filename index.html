<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberObfuscator Ultimate | Enterprise AST IDE v6.3</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.292.0/umd/lucide.min.js"></script>
    
    <!-- Compiler & Core Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.37.1/min/vs/loader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/standalone/umd/vis-network.min.js"></script>
    
    <!-- Layout & Terminal -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dockview-core@1.2.6/dist/dockview.css">
    <script src="https://cdn.jsdelivr.net/npm/dockview-core@1.2.6/dist/dockview-core.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/addons/fit/addon-fit.min.js"></script>

    <style>
        /* ====================================================
           THEME ENGINE & GLOBALS
           ==================================================== */
        :root {
            --bg-root: #020205; --bg-panel: rgba(12, 12, 22, 0.85); --bg-panel-solid: #0c0c16; --bg-input: rgba(0,0,0,0.4);
            --bg-hover: rgba(0, 240, 255, 0.1); --bg-active: rgba(0, 240, 255, 0.15);
            --border-dim: rgba(0, 240, 255, 0.15); --border-glow: rgba(0, 240, 255, 0.4);
            --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-muted: #475569;
            --accent-cyan: #00f0ff; --accent-magenta: #ff003c; --accent-green: #10b981; --accent-yellow: #f59e0b;
            --font-ui: 'Inter', system-ui, sans-serif; --font-mono: 'Fira Code', monospace;
            --radius: 6px; --z-base: 1; --z-panel: 10; --z-modal: 1000; --z-toast: 2000; --z-cmd: 3000;
        }

        :root[data-theme="midnight"] { --bg-root: #0a0a12; --bg-panel-solid: #121220; --border-dim: #2a2a40; --accent-cyan: #7c7cff; --bg-hover: rgba(124,124,255,0.1); }
        :root[data-theme="light"] { --bg-root: #f1f5f9; --bg-panel-solid: #ffffff; --bg-input: #f8fafc; --border-dim: #cbd5e1; --text-primary: #0f172a; --text-secondary: #475569; --accent-cyan: #0ea5e9; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg-root); color: var(--text-primary); font-family: var(--font-ui); display: flex; flex-direction: column; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: var(--radius); }
        
        .dockview-theme-dark { --dv-background-color: var(--bg-root); --dv-pane-background-color: var(--bg-panel-solid); --dv-tabs-and-actions-container-background-color: #05050a; --dv-activegroup-visiblepanel-tab-background-color: var(--bg-panel-solid); --dv-activegroup-visiblepanel-tab-color: var(--accent-cyan); --dv-separator-border: var(--border-dim); }

        /* UI Structure */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1rem; border-bottom: 1px solid var(--border-dim); z-index: var(--z-panel); background: var(--bg-panel-solid); height: 55px; flex-shrink: 0; }
        .app-workspace { flex: 1; width: 100%; overflow: hidden; position: relative; } 
        .app-footer { display: flex; justify-content: space-between; align-items: center; padding: 0 1rem; height: 28px; border-top: 1px solid var(--border-dim); background: var(--bg-panel-solid); font-size: 0.75rem; color: var(--text-secondary); flex-shrink: 0; }
        
        .brand { display: flex; align-items: center; gap: 0.75rem; }
        .brand h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; margin: 0; }
        .badge { background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.65rem; border: 1px solid var(--border-dim); }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.4rem 0.75rem; border: 1px solid var(--border-dim); border-radius: var(--radius); background: rgba(255,255,255,0.02); color: var(--text-primary); font-family: var(--font-ui); font-size: 0.8rem; cursor: pointer; transition: 0.2s; outline: none; }
        .btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-glow); }
        .btn-icon { padding: 0.4rem; border-color: transparent; background: transparent; color: var(--text-secondary); }
        .btn-primary { background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.15); font-weight: 600; }
        
        .toolbar { padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border-dim); display: flex; gap: 0.5rem; background: rgba(0,0,0,0.2); align-items: center; flex-wrap: wrap; }
        .list-view { height: 100%; overflow-y: auto; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.2rem; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.75rem; border-radius: 4px; border: 1px solid transparent; font-size: 0.85rem; cursor: pointer; color: var(--text-secondary); }
        .list-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .list-item.active { background: var(--bg-active); color: var(--accent-cyan); border-color: var(--accent-cyan); }
        
        .cyber-input, .cyber-select { width: 100%; background: var(--bg-input); border: 1px solid var(--border-dim); color: var(--text-primary); padding: 0.4rem 0.5rem; border-radius: var(--radius); font-size: 0.8rem; font-family: var(--font-mono); outline: none; }
        textarea.cyber-input { padding: 1rem; font-family: var(--font-mono); font-size: 13px; color: #a5b4fc; background: #080810; border: none; }
        textarea.cyber-input[readonly] { color: #6ee7b7; background: #05050a; }

        .toggle-switch { position: relative; width: 32px; height: 18px; display: inline-block; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: rgba(255,255,255,0.1); transition: .3s; border-radius: 18px; border: 1px solid var(--border-dim); }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: var(--text-secondary); transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(0, 240, 255, 0.15); border-color: var(--accent-cyan); }
        input:checked + .slider:before { transform: translateX(14px); background-color: var(--accent-cyan); }

        .ast-node { font-family: var(--font-mono); padding-left: calc(var(--depth, 0) * 15px + 10px); display: flex; align-items: center; padding-top: 0.1rem; padding-bottom: 0.1rem; cursor: pointer; font-size: 0.8rem;}
        .ast-node:hover { background: var(--bg-hover); }
        .stat-card { background: var(--bg-panel-solid); border: 1px solid var(--border-dim); border-radius: var(--radius); padding: 1rem; flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        
        #cmd-palette { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; background: var(--bg-panel-solid); border: 1px solid var(--accent-cyan); border-radius: var(--radius); box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: var(--z-cmd); display: none; flex-direction: column; }
        #cmd-palette.active { display: flex; }
        .modal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: var(--z-modal); opacity: 0; pointer-events: none; transition: 0.15s; }
        .modal-wrap.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--bg-panel-solid); border: 1px solid var(--border-dim); border-radius: var(--radius); padding: 1.5rem; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;}
        #toast-zone { position: fixed; bottom: 35px; right: 20px; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
        .toast { background: var(--bg-panel-solid); border: 1px solid var(--border-dim); border-left: 3px solid var(--accent-cyan); padding: 1rem; border-radius: var(--radius); display: flex; gap: 0.75rem; animation: slideIn 0.3s forwards; pointer-events: all; max-width: 350px; }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
        
        /* New Pipeline UI Classes */
        .badge-phase { background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.55rem; border: 1px solid var(--border-dim); text-transform: uppercase;}
        .badge-dep { background: rgba(148, 163, 184, 0.1); color: var(--text-secondary); padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.55rem; border: 1px solid var(--border-dim); }
        .badge-err { background: rgba(255, 0, 60, 0.1); color: var(--accent-magenta); padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.55rem; border: 1px solid rgba(255, 0, 60, 0.3); }

        @media (max-width: 600px) {
            .app-header { flex-direction: column; height: auto; gap: 0.5rem; padding: 1rem; }
            .badge { display: none; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <i data-lucide="shield-check" style="color: var(--accent-cyan);"></i>
            <h1>CYBER<span style="font-weight: 300; color: var(--text-secondary);">OBFUSCATOR</span></h1>
            <span class="badge">ENT v6.3</span>
        </div>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; justify-content:center;">
            <button class="btn btn-icon" title="Command Palette (Ctrl+Shift+P)" onclick="App.cmd.show()"><i data-lucide="command"></i></button>
            <div style="width:1px; height:20px; background:var(--border-dim);"></div>
            <button class="btn btn-icon" title="Build History" onclick="App.layout.openPanel('build-history')"><i data-lucide="history"></i></button>
            <button class="btn btn-icon" title="Build Analysis" onclick="App.layout.openPanel('analysis')"><i data-lucide="bar-chart-2"></i></button>
            <button class="btn btn-icon" title="Export Outputs" onclick="App.export('out')"><i data-lucide="package-export"></i></button>
            <button class="btn btn-primary" id="btn-compile" onclick="App.compile()">
                <i data-lucide="cpu" style="width: 16px;"></i> Compile Workspace
            </button>
        </div>
    </header>

    <div class="app-workspace" id="dockview-container"></div>

    <footer class="app-footer">
        <div style="display:flex; gap:1rem; align-items: center;">
            <span style="color:var(--accent-green);"><i data-lucide="check-circle" style="width:12px;"></i> Core Online</span>
            <span id="foot-pos" style="display:none;">Ln 1, Col 1</span>
            <span id="foot-comp" style="color: var(--accent-magenta);">Pass Manager Engine (Offline Safe)</span>
        </div>
        <div style="display:flex; gap:1rem; align-items: center;">
            <span id="foot-save" style="color:var(--text-muted);">Unsaved</span>
            <span id="foot-file">No File Selected</span>
        </div>
    </footer>

    <!-- Command Palette -->
    <div id="cmd-palette">
        <input type="text" id="cmd-input" class="cyber-input" style="border:none; border-bottom:1px solid var(--border-dim); padding:1rem; font-size:1.1rem; background:transparent;" placeholder="Type a command...">
        <div id="cmd-list" class="list-view" style="max-height: 300px;"></div>
    </div>

    <!-- Modals & Toasts -->
    <div class="modal-wrap" id="generic-modal"><div class="modal-content" id="modal-content-inner"></div></div>
    <div id="toast-zone"></div>

    <!-- Hidden Templates for Panels -->
    <template id="tpl-explorer">
        <div class="toolbar" style="gap:0.25rem;">
            <button class="btn btn-icon" title="New File" onclick="App.ws.promptNewFile()"><i data-lucide="file-plus"></i></button>
            <button class="btn btn-icon" title="Upload Files" onclick="document.getElementById('file-in').click()"><i data-lucide="upload"></i></button>
        </div>
        <input type="file" id="file-in" multiple hidden onchange="App.ws.handleUpload(event)">
        <div id="explorer-tree" class="list-view"></div>
    </template>

    <template id="tpl-pipeline">
        <div class="toolbar" style="justify-content:space-between;">
            <select id="preset-sel" class="cyber-select" style="width:auto; padding:0.2rem;" onchange="App.pipeline.applyPreset(this.value)">
                <option value="custom">Custom</option><option value="low">Low (Perf)</option><option value="balanced" selected>Balanced</option><option value="extreme">Extreme</option>
            </select>
            <button class="btn btn-icon" title="Validate & Plan Execution" onclick="App.pipeline.validate()"><i data-lucide="shield-alert"></i></button>
        </div>
        <div id="pipe-list" class="list-view" style="flex:1;"></div>
    </template>

    <template id="tpl-ast">
        <div class="toolbar">
            <select id="ast-mode" class="cyber-select" style="width:auto; padding:0.2rem;" onchange="App.ast.render()"><option value="src">Original AST</option><option value="out">Transformed AST</option></select>
            <button class="btn btn-icon" title="Export JSON" onclick="App.ast.export()"><i data-lucide="download"></i></button>
            <span id="ast-count" style="margin-left:auto; font-size:0.75rem; color:var(--text-muted);"></span>
        </div>
        <div id="ast-tree" class="list-view" style="overflow-x:auto;"></div>
    </template>

    <template id="tpl-dashboard">
        <div class="list-view" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; padding:1rem;" id="dash-grid"></div>
    </template>

    <template id="tpl-analysis">
        <div class="toolbar">
            <span style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Build Telemetry & Diagnostics</span>
        </div>
        <div id="analysis-content" class="list-view" style="padding:1.5rem; font-family:var(--font-ui); font-size:0.85rem; line-height:1.6;">
            <div style="color:var(--text-muted); text-align:center; padding:2rem;">Run a build to generate comprehensive analysis.</div>
        </div>
    </template>

    <template id="tpl-plugins">
        <div class="toolbar"><button class="btn btn-primary" style="font-size:0.7rem;" onclick="App.plugins.createBoilerplate()">+ New Plugin</button></div>
        <div id="plugin-list" class="list-view"></div>
    </template>

    <script type="module">
        const Bus = new class {
            constructor() { this.l = {}; }
            on(e, cb) { (this.l[e] = this.l[e] || []).push(cb); }
            emit(e, d) { (this.l[e] || []).forEach(cb => cb(d)); }
        };

        const UI = {
            icon: (i) => `<i data-lucide="${i}" style="width:14px; height:14px;">[+]</i>`,
            toast(msg, type = 'info') {
                const z = document.getElementById('toast-zone'); const t = document.createElement('div'); t.className = `toast ${type}`;
                const i = { info: 'info', success: 'check-circle', error: 'x-octagon', warn: 'alert-triangle' }[type];
                t.innerHTML = `<i data-lucide="${i}" style="flex-shrink:0;"></i> <div>${msg}</div>`; z.appendChild(t); 
                if (typeof lucide !== 'undefined') lucide.createIcons({root: t});
                setTimeout(() => { t.style.animation = 'slideIn 0.3s reverse forwards'; setTimeout(()=>t.remove(), 300); }, 4000);
            },
            modal(title, html, actions = []) {
                const wrap = document.getElementById('generic-modal'), inner = document.getElementById('modal-content-inner');
                let btns = actions.map((a, i) => `<button class="btn ${a.primary?'btn-primary':''}" id="mbtn-${i}">${a.text}</button>`).join('');
                inner.innerHTML = `<h3 style="margin-bottom:1rem; font-weight:500;">${title}</h3><div>${html}</div><div style="display:flex; gap:0.5rem; justify-content:flex-end; margin-top:1.5rem;"><button class="btn" onclick="document.getElementById('generic-modal').classList.remove('active')">Cancel</button>${btns}</div>`;
                wrap.classList.add('active'); actions.forEach((a, i) => document.getElementById(`mbtn-${i}`).onclick = () => { if(a.cb()!==false) wrap.classList.remove('active'); });
                if(typeof lucide !== 'undefined') lucide.createIcons({root:inner});
            },
            bytes: (b) => { if(b===0) return '0 B'; const k=1024, s=['B','KB','MB','GB'], i=Math.floor(Math.log(b)/Math.log(k)); return parseFloat((b/Math.pow(k,i)).toFixed(2))+' '+s[i]; },
            log: (msg, type = 'info') => { if (window.App && App.term) App.term.log(msg, type); else console.log(`[${type.toUpperCase()}] ${msg}`); }
        };

        const Storage = new class {
            constructor() { try { if(window.localforage) localforage.config({name:'CyberIDE'}); }catch(e){} }
            async get(k) { return window.localforage ? await localforage.getItem(k).catch(()=>null) : null; }
            async set(k, v) { if(window.localforage) await localforage.setItem(k, v).catch(()=>{}); }
        };

        class WorkspaceEngine {
            constructor() { this.files = new Map(); this.active = null; }
            addFile(name, content, load=false) {
                if(this.files.has(name)) return false;
                const lang = name.endsWith('.ts')||name.endsWith('.tsx')?'typescript':'javascript';
                
                this.files.set(name, { 
                    content, output: '', lang, 
                    inAst: null, outAst: null, astState: null,
                    mod: false 
                });
                
                Bus.emit('fs-change'); if(load) this.openFile(name);
                return true;
            }
            removeFile(name) {
                this.files.delete(name); App.layout.closeFile(name); Bus.emit('fs-change');
            }
            openFile(name) { 
                if(!this.files.has(name)) return; 
                
                // Track previous active file for proper editor cleanup in fallback mode
                const prevActive = this.active; 
                this.active = name; 
                
                App.layout.openFile(name, prevActive); 
                document.getElementById('foot-file').innerText = name; 
                
                // Force explorer to re-render so the newly active file is highlighted
                Bus.emit('fs-change'); 
            }
            updateContent(name, content) {
                const f = this.files.get(name); if(f && f.content !== content) { f.content = content; f.mod = true; Bus.emit('fs-content', name); }
            }
            promptNewFile() { UI.modal('New File', '<div class="input-group"><label>Filename</label><input type="text" id="m-fn" class="cyber-input" value="utils.js"></div>', [{text:'Create', primary:true, cb:()=>{ const n=document.getElementById('m-fn').value; if(n) this.addFile(n, '// new\n', true); }}]); }
            handleUpload(e) { Array.from(e.target.files).forEach(f => { const r = new FileReader(); r.onload = ev => this.addFile(f.webkitRelativePath||f.name, ev.target.result, true); r.readAsText(f); }); }
            async autoSave() { await Storage.set('ws_snap', JSON.stringify({ active: this.active, files: Array.from(this.files.entries()).map(([n,f])=>({n, c:f.content, l:f.lang})) })); document.getElementById('foot-save').innerText = `Saved ${new Date().toLocaleTimeString()}`; }
            async load() { const s = await Storage.get('ws_snap'); if(s) { const data = JSON.parse(s); if(data.files) { data.files.forEach(f => this.addFile(f.n, f.c, false)); if(data.active) this.openFile(data.active); return true; } } return false; }
        }

        // --- MULTI-PASS TRANSFORMATION ENGINE ---
        const PassPhases = {
            PARSE: 'PARSE',
            ANALYZE: 'ANALYZE',
            NORMALIZE: 'NORMALIZE',
            TRANSFORM: 'TRANSFORM',
            OPTIMIZE: 'OPTIMIZE',
            VALIDATE: 'VALIDATE',
            GENERATE: 'GENERATE',
            POST_PROCESS: 'POST_PROCESS'
        };

        class ASTStateManager {
            constructor(initialAst) {
                this.originalAst = JSON.parse(JSON.stringify(initialAst)); 
                this.currentAst = initialAst;
                this.transformedAst = null;
                
                this.metadata = new Map();
                this.passHistory = [];
                
                this.statistics = { 
                    totalTime: 0, 
                    totalPasses: 0,
                    successfulPasses: 0,
                    failedPasses: 0,
                    skippedPasses: 0,
                    modifications: 0, 
                    nodesVisited: 0,
                    analysisTime: 0,
                    transformationTime: 0,
                    validationTime: 0,
                    generationTime: 0
                };
                
                this.warnings = [];
                this.errors = [];
                
                this.originalAstNodesCount = this.analyzeAst(this.originalAst).nodes;
                this.currentNodesCount = this.originalAstNodesCount;
            }
            
            // Memory-conscious analyzer - cap recursion depth to prevent stack overflows
            analyzeAst(node, seen = new Set(), depth = 0) {
                let stats = { nodes: 0, identifiers: 0, literals: 0, complexity: 0 };
                if (!node || typeof node !== 'object' || depth > 200) return stats;
                if (seen.has(node)) return stats; 
                seen.add(node);
                
                if (Array.isArray(node)) {
                    for (let item of node) {
                        let s = this.analyzeAst(item, seen, depth + 1);
                        stats.nodes += s.nodes; stats.identifiers += s.identifiers; 
                        stats.literals += s.literals; stats.complexity += s.complexity;
                    }
                } else if (node.type) {
                    stats.nodes++;
                    if (node.type === 'Identifier') stats.identifiers++;
                    if (node.type.endsWith('Literal')) stats.literals++;
                    if (['IfStatement', 'ForStatement', 'WhileStatement', 'DoWhileStatement', 'SwitchStatement', 'ConditionalExpression', 'TryStatement', 'CatchClause', 'LogicalExpression'].includes(node.type)) {
                        stats.complexity++;
                    }
                    for (let key in node) {
                        if (['loc', 'start', 'end', 'leadingComments', 'trailingComments', 'extra', 'parent'].includes(key)) continue;
                        let s = this.analyzeAst(node[key], seen, depth + 1);
                        stats.nodes += s.nodes; stats.identifiers += s.identifiers; 
                        stats.literals += s.literals; stats.complexity += s.complexity;
                    }
                }
                return stats;
            }

            recordPassStart(passName) {
                return { 
                    name: passName, 
                    startTime: performance.now(), 
                    analysisTime: 0,
                    validationTime: 0,
                    modifications: 0, 
                    nodesVisited: 0,
                    preStats: this.analyzeAst(this.currentAst),
                    warningsStartIdx: this.warnings.length,
                    errorsStartIdx: this.errors.length
                };
            }
            
            recordPassEnd(tracker) {
                tracker.time = performance.now() - tracker.startTime;
                tracker.transformationTime = Math.max(0, tracker.time - tracker.analysisTime - tracker.validationTime);
                
                tracker.postStats = this.analyzeAst(this.currentAst);
                this.currentNodesCount = tracker.postStats.nodes;
                
                tracker.deltas = {
                    nodes: tracker.postStats.nodes - tracker.preStats.nodes,
                    identifiers: tracker.postStats.identifiers - tracker.preStats.identifiers,
                    literals: tracker.postStats.literals - tracker.preStats.literals,
                    complexity: tracker.postStats.complexity - tracker.preStats.complexity
                };
                
                tracker.warnings = this.warnings.slice(tracker.warningsStartIdx);
                tracker.errors = this.errors.slice(tracker.errorsStartIdx);
                
                this.passHistory.push(tracker);
                this.statistics.totalTime += tracker.time;
                this.statistics.analysisTime += tracker.analysisTime;
                this.statistics.validationTime += tracker.validationTime;
                this.statistics.transformationTime += tracker.transformationTime;
                
                this.statistics.modifications += tracker.modifications;
                this.statistics.nodesVisited += tracker.nodesVisited;
            }

            addWarning(msg) { this.warnings.push(msg); UI.log(`[AST Warning] ${msg}`, 'warn'); }
            addError(msg) { this.errors.push(msg); UI.log(`[AST Error] ${msg}`, 'error'); }
            addLog(msg) { UI.log(`[Pass Context] ${msg}`, 'info'); }
            
            updateCurrentAst(ast) { this.currentAst = ast; }
            finalize(ast) { this.transformedAst = JSON.parse(JSON.stringify(ast)); this.currentAst = ast; }

            generateReport(filename) {
                let r = `\nPASS EXECUTION STATISTICS (${filename})\n`;
                r += `───────────────────────────────────────────────────────────────────────────────\n`;
                r += `PASS                 TIME      NODES (Δ)     ID (Δ)   LIT (Δ)  CPLX (Δ) ALRTS\n`;
                r += `───────────────────────────────────────────────────────────────────────────────\n`;
                this.passHistory.forEach(p => {
                    const name = p.name.padEnd(20, ' ').substring(0, 20);
                    const time = (p.time.toFixed(1) + 'ms').padEnd(9, ' ');
                    
                    const nd = p.deltas.nodes > 0 ? `+${p.deltas.nodes}` : p.deltas.nodes;
                    const nodes = `${p.postStats.nodes} (${nd})`.padEnd(13, ' ');
                    
                    const idd = (p.deltas.identifiers > 0 ? `+${p.deltas.identifiers}` : p.deltas.identifiers).toString().padEnd(8, ' ');
                    const litd = (p.deltas.literals > 0 ? `+${p.deltas.literals}` : p.deltas.literals).toString().padEnd(8, ' ');
                    const cplxd = (p.deltas.complexity > 0 ? `+${p.deltas.complexity}` : p.deltas.complexity).toString().padEnd(8, ' ');
                    
                    let alerts = '';
                    if(p.warnings.length) alerts += `${p.warnings.length}W `;
                    if(p.errors.length) alerts += `${p.errors.length}E`;
                    if(!alerts) alerts = '-       ';
                    
                    r += `${name} ${time} ${nodes} ${idd} ${litd} ${cplxd} ${alerts}\n`;
                });
                r += `───────────────────────────────────────────────────────────────────────────────\n`;
                r += `TOTAL TIMING         ${this.statistics.totalTime.toFixed(1)}ms\n`;
                return r;
            }
        }

        class TransformationPass {
            constructor(config) {
                this.id = config.id;
                this.name = config.name;
                this.description = config.description;
                this.phase = config.phase || PassPhases.TRANSFORM;
                this.priority = config.priority || 50;
                this.enabled = config.enabled !== false;
                this.dependencies = config.dependencies || [];
                this.conflicts = config.conflicts || [];
                this.supportedLangs = config.supportedLangs || ['javascript', 'typescript'];
                this.repeatable = !!config.repeatable;
                this.cost = config.cost || 1;
                
                this.visitor = config.visitor || null;
                this.analyze = config.analyze || null;
                this.validate = config.validate || null;
                this.pluginFactory = config.pluginFactory || null;
            }

            toBabelPlugin(stateManager, passTracker) {
                const self = this;
                return function(b) {
                    let basePlugin = self.pluginFactory ? self.pluginFactory(b) : { visitor: self.visitor || {} };
                    let origPre = basePlugin.pre;
                    let origPost = basePlugin.post;

                    basePlugin.pre = function(state) {
                        let t0 = performance.now();
                        this.astState = stateManager;
                        this.passTracker = passTracker;
                        if (self.analyze) self.analyze.call(this, state, b);
                        if (origPre) origPre.call(this, state);
                        passTracker.analysisTime += (performance.now() - t0);
                    };

                    basePlugin.post = function(state) {
                        let t0 = performance.now();
                        if (origPost) origPost.call(this, state);
                        if (self.validate) self.validate.call(this, state, b);
                        passTracker.validationTime += (performance.now() - t0);
                    };

                    basePlugin.name = self.id;
                    return basePlugin;
                };
            }
        }

        class CompilerEngine {
            constructor() {
                this.passes = new Map();
                this.initPasses();
                // Execution safety budgets
                this.BUDGETS = {
                    MAX_TIME_MS: 15000, 
                    MAX_AST_NODES: 250000,
                    MAX_GROWTH_RATIO: 5.0
                };
            }
            
            initPasses() {
                const passConfigs = [
                    {
                        id: 'rename-identifiers', name: 'Scope-Aware Renaming', description: 'Secure identifier mangling.', 
                        phase: PassPhases.NORMALIZE, priority: 10, enabled: true, dependencies: [], conflicts: [],
                        pluginFactory: b => ({ visitor: { Identifier(path) {
                            if (this.passTracker) this.passTracker.nodesVisited++;
                            const res = new Set(['window','document','console','Math','JSON','Date','Promise','require','exports','module']);
                            if(res.has(path.node.name) || (path.parent.type==='MemberExpression' && path.parent.property===path.node && !path.parent.computed)) return;
                            if(path.isBindingIdentifier()) {
                                path.scope.rename(path.node.name, path.scope.generateUidIdentifier('_0x').name);
                                if (this.passTracker) this.passTracker.modifications++;
                            }
                        }}})
                    },
                    {
                        id: 'string-pooling', name: 'Dynamic Base64 String Pooling', description: 'Extracts and Base64 encodes strings.', 
                        phase: PassPhases.TRANSFORM, priority: 20, enabled: true, 
                        dependencies: ['rename-identifiers'], conflicts: [],
                        
                        analyze(state, file) { this.astState.metadata.set('stringPool', new Map()); },
                        validate(state, file) {
                            const pool = this.astState.metadata.get('stringPool');
                            if (pool && pool.size > 0) this.astState.addLog(`String pooling extracted ${pool.size} unique strings.`);
                        },
                        pluginFactory: b => { 
                            const t = b.types; 
                            return { 
                                visitor: { 
                                    Program: { 
                                        exit(path, state) {
                                            if (path.node._sp) return; 
                                            const strs = this.astState.metadata.get('stringPool');
                                            if (!strs) return;
                                            
                                            path.traverse({ 
                                                StringLiteral(p) {
                                                    if(['ImportDeclaration','ExportNamedDeclaration'].includes(p.parent.type) || p.node.value.length<2 || p.node.value==='use strict') return;
                                                    if(p.parent.type==='Property' && p.parent.key===p.node) return;
                                                    if(!strs.has(p.node.value)) strs.set(p.node.value, []); 
                                                    strs.get(p.node.value).push(p);
                                                }
                                            });
                                            
                                            if(strs.size===0) return;
                                            const poolId = path.scope.generateUidIdentifier("pool"), decId = path.scope.generateUidIdentifier("dec");
                                            const poolArr = []; let idx=0;
                                            
                                            for(let [val, paths] of strs.entries()) { 
                                                poolArr.push(t.stringLiteral(btoa(unescape(encodeURIComponent(val))))); 
                                                paths.forEach(p => p.replaceWith(t.callExpression(decId, [t.memberExpression(poolId, t.numericLiteral(idx), true)]))); 
                                                idx++; 
                                            }
                                            
                                            const decFunc = t.functionDeclaration(decId, [t.identifier('b')], t.blockStatement([
                                                t.returnStatement(t.callExpression(t.identifier('decodeURIComponent'), [t.callExpression(t.identifier('escape'), [t.callExpression(t.identifier('atob'), [t.identifier('b')])])]))
                                            ]));
                                            
                                            path.node.body.unshift(t.variableDeclaration("const", [t.variableDeclarator(poolId, t.arrayExpression(poolArr))]), decFunc);
                                            path.node._sp = true;
                                            this.passTracker.modifications += strs.size;
                                        }
                                    }
                                }
                            }; 
                        }
                    },
                    {
                        id: 'number-encoding', name: 'Numeric XOR Encoding', description: 'Transforms literals into XOR.', 
                        phase: PassPhases.TRANSFORM, priority: 30, enabled: true, dependencies: [], conflicts: [],
                        pluginFactory: b => { const t = b.types; return { visitor: { NumericLiteral(path) {
                            if (this.passTracker) this.passTracker.nodesVisited++;
                            if(['UnaryExpression','BinaryExpression','MemberExpression'].includes(path.parent.type) || !Number.isInteger(path.node.value)) return;
                            const v = path.node.value, k = Math.floor(Math.random()*1000);
                            path.replaceWith(t.binaryExpression('^', t.numericLiteral(v^k), t.numericLiteral(k))); 
                            if (this.passTracker) this.passTracker.modifications++;
                            path.skip();
                        }}}}
                    },
                    {
                        id: 'boolean-encoding', name: 'Boolean Transformation', description: 'Replaces true/false.', 
                        phase: PassPhases.TRANSFORM, priority: 40, enabled: true, dependencies: [], conflicts: [],
                        pluginFactory: b => { const t = b.types; return { visitor: { BooleanLiteral(path) {
                            if (this.passTracker) this.passTracker.nodesVisited++;
                            path.replaceWith(t.unaryExpression('!', t.unaryExpression('!', t.arrayExpression(path.node.value?[t.numericLiteral(0)]:[])))); 
                            if (this.passTracker) this.passTracker.modifications++;
                            path.skip();
                        }}}}
                    },
                    {
                        id: 'control-flow', name: 'Control Flow Flattening', description: 'State-machine conversion.', 
                        phase: PassPhases.OPTIMIZE, priority: 10, enabled: true, 
                        dependencies: ['string-pooling'], conflicts: [],
                        analyze(state, file) {
                            const pool = this.astState.metadata.get('stringPool');
                            if (pool) this.astState.addLog(`Control Flow recognized String Pool presence. Adapting AST flow...`);
                        },
                        pluginFactory: b => { const t = b.types; return { visitor: { Function(path) {
                            if (this.passTracker) this.passTracker.nodesVisited++;
                            if(path.node.body.type!=='BlockStatement' || path.node.body.body.length<2 || path.node._cf) return;
                            const orig = path.node.body.body;
                            path.node.body = t.blockStatement([t.variableDeclaration('var', [t.variableDeclarator(t.identifier('_s'), t.numericLiteral(0))]), t.whileStatement(t.booleanLiteral(true), t.blockStatement([t.switchStatement(t.identifier('_s'), [t.switchCase(t.numericLiteral(0), [...orig, t.expressionStatement(t.assignmentExpression('=', t.identifier('_s'), t.numericLiteral(1)))]), t.switchCase(t.numericLiteral(1), [t.breakStatement()])])]))]);
                            path.node._cf = true;
                            if (this.passTracker) this.passTracker.modifications++;
                        }}}}
                    },
                    {
                        id: 'self-defending', name: 'Self-Defending Code', description: 'Anti-beautification crashes.', 
                        phase: PassPhases.POST_PROCESS, priority: 10, enabled: false, dependencies: [], 
                        conflicts: ['minify'],
                        pluginFactory: b => { const t = b.types; return { visitor: { Program: { exit(path) {
                            if (path.node._sd) return;
                            const fc = t.expressionStatement(t.callExpression(t.functionExpression(null, [], t.blockStatement([t.ifStatement(t.callExpression(t.memberExpression(t.regExpLiteral('[\\\\r\\\\n]+'), t.identifier('test')), [t.callExpression(t.memberExpression(path.scope.generateUidIdentifier("d"), t.identifier('toString')), [])]), t.whileStatement(t.booleanLiteral(true), t.blockStatement([]))), ...path.node.body])), []));
                            path.node.body = [fc]; path.node._sd = true;
                            if (this.passTracker) this.passTracker.modifications++;
                        }}}} }
                    },
                    {
                        id: 'anti-debug', name: 'Advanced Anti-Debugging', description: 'Devtools block.', 
                        phase: PassPhases.POST_PROCESS, priority: 20, enabled: false, dependencies: [], conflicts: [],
                        pluginFactory: b => { const t = b.types; return { visitor: { Program(path) {
                            if (path.node._ad) return; 
                            const dbg = t.expressionStatement(t.callExpression(t.identifier('setInterval'), [t.functionExpression(null, [], t.blockStatement([t.debuggerStatement()])), t.numericLiteral(2000)]));
                            path.node.body.unshift(dbg); path.node._ad = true;
                            if (this.passTracker) this.passTracker.modifications++;
                        }}}}
                    },
                    {
                        id: 'minify', name: 'AST Minification', description: 'Compacts generated output.', 
                        phase: PassPhases.GENERATE, priority: 90, enabled: true, dependencies: [], conflicts: [],
                        pluginFactory: b => ({ visitor: {} })
                    }
                ];
                
                passConfigs.forEach(cfg => this.passes.set(cfg.id, new TransformationPass(cfg)));
            }
            
            planExecution(activePasses, uiConfig) {
                const result = { success: true, sequence: [], errors: [], warnings: [] };
                const activeMap = new Map();
                
                activePasses.forEach(p => {
                    let uiIdx = uiConfig.findIndex(c => c.id === p.id);
                    p._uiIndex = uiIdx === -1 ? 999 : uiIdx; 
                    activeMap.set(p.id, p);
                });

                for (let p of activePasses) {
                    if (p.conflicts) {
                        for (let cId of p.conflicts) {
                            if (activeMap.has(cId)) {
                                result.errors.push(`Conflict Detected: '${p.name}' is explicitly incompatible with '${activeMap.get(cId).name}'.`);
                                result.success = false;
                            }
                        }
                    }
                }
                if (!result.success) return result;

                const adj = new Map(); 
                const inDegree = new Map();
                activePasses.forEach(p => { adj.set(p.id, []); inDegree.set(p.id, 0); });

                for (let p of activePasses) {
                    if (p.dependencies) {
                        for (let depId of p.dependencies) {
                            if (activeMap.has(depId)) {
                                adj.get(depId).push(p.id);
                                inDegree.set(p.id, inDegree.get(p.id) + 1);
                            }
                        }
                    }
                }

                const phaseOrder = Object.values(PassPhases);
                let queue = [];
                for (let [id, deg] of inDegree.entries()) {
                    if (deg === 0) queue.push(activeMap.get(id));
                }

                const sorted = [];
                while (queue.length > 0) {
                    queue.sort((a, b) => {
                        let phaseA = phaseOrder.indexOf(a.phase);
                        let phaseB = phaseOrder.indexOf(b.phase);
                        if (phaseA !== phaseB) return phaseA - phaseB;
                        if (a._uiIndex !== b._uiIndex) return a._uiIndex - b._uiIndex;
                        return a.priority - b.priority;
                    });

                    const current = queue.shift();
                    sorted.push(current);

                    for (let neighborId of adj.get(current.id)) {
                        let count = inDegree.get(neighborId) - 1;
                        inDegree.set(neighborId, count);
                        if (count === 0) queue.push(activeMap.get(neighborId));
                    }
                }

                if (sorted.length !== activePasses.length) {
                    result.success = false;
                    result.errors.push("Impossible Ordering: Circular dependency detected among the enabled passes.");
                    return result;
                }

                for (let i = 0; i < sorted.length; i++) {
                    let p = sorted[i];
                    if (p.dependencies) {
                        for (let depId of p.dependencies) {
                            if (activeMap.has(depId)) {
                                let uiDepIndex = activeMap.get(depId)._uiIndex;
                                if (p._uiIndex < uiDepIndex) {
                                    result.warnings.push(`Planner: Relocated '${p.name}' to execute AFTER '${activeMap.get(depId).name}' (Dependency resolution).`);
                                }
                            }
                        }
                    }
                    
                    let myPhaseIdx = phaseOrder.indexOf(p.phase);
                    for (let j = 0; j < i; j++) {
                        let earlierPass = sorted[j];
                        let earlierPhaseIdx = phaseOrder.indexOf(earlierPass.phase);
                        if (earlierPhaseIdx < myPhaseIdx && earlierPass._uiIndex > p._uiIndex) {
                            result.warnings.push(`Planner: Relocated '${p.name}' to execute AFTER '${earlierPass.name}' (Phase constraint).`);
                        }
                    }
                }
                
                result.warnings = [...new Set(result.warnings)]; 
                result.sequence = sorted;
                return result;
            }

            async execute(code, lang, uiConfig, customPlugins = [], filename = "unknown") {
                return new Promise(async (resolve, reject) => {
                    try {
                        if(typeof Babel === 'undefined') throw new Error("Babel Compiler is blocked by your Android Viewer.");
                        
                        let activePasses = [];
                        uiConfig.forEach(cfg => {
                            if (cfg.enabled) {
                                let passDef = this.passes.get(cfg.id);
                                if(passDef) activePasses.push(passDef);
                            }
                        });

                        customPlugins.forEach(cp => { 
                            try { 
                                const pluginFn = new Function('babel', 'return ('+cp.code+')(babel);');
                                activePasses.push(new TransformationPass({
                                    id: `custom-${cp.name.replace(/[^a-zA-Z0-9-]/g, '')}`, name: cp.name, description: 'Custom Workspace Plugin',
                                    phase: PassPhases.TRANSFORM, priority: 99, enabled: true, pluginFactory: pluginFn
                                }));
                            } catch(e) { UI.log(`Custom Plugin Error: ${e.message}`, 'error'); }
                        });
                        
                        const plan = this.planExecution(activePasses, uiConfig);
                        if (!plan.success) {
                            plan.errors.forEach(err => UI.log(err, 'error'));
                            throw new Error("Compilation halted: Invalid pipeline execution plan.");
                        }
                        
                        plan.warnings.forEach(warn => UI.log(warn, 'warn'));
                        UI.log(`Planner calculated optimal execution path: ${plan.sequence.map(p => p.id).join(' ➔ ')}`, 'system');

                        Bus.emit('compile-start', plan.sequence.map(p => p.id));
                        await new Promise(r => setTimeout(r, 15)); // Yield for initial UI paint
                        
                        let globalStartTime = performance.now();
                        let totalTime = 0;
                        
                        Bus.emit('pass-start', 'sys-parse');
                        await new Promise(r => setTimeout(r, 5));
                        
                        const parseRes = Babel.transform(code, { 
                            presets: lang === 'typescript' ? [['typescript', {isTSX: true, allExtensions: true}]] : [], 
                            ast: true, code: false 
                        });
                        
                        const stateManager = new ASTStateManager(parseRes.ast); 
                        stateManager.statistics.totalPasses = plan.sequence.length;
                        
                        let parseTime = performance.now() - globalStartTime;
                        stateManager.statistics.analysisTime += parseTime;
                        totalTime += parseTime;
                        
                        Bus.emit('pass-end', { id: 'sys-parse', status: 'COMPLETE', stats: { time: parseTime, modifications: 0, deltas: {nodes:0,identifiers:0,literals:0,complexity:0}, warnings: [], errors: [] }});

                        const passesToRun = plan.sequence.filter(p => p.phase !== PassPhases.GENERATE);
                        
                        for (let pass of passesToRun) {
                            // ----------------------------------------------------
                            // SAFETY: BUDGET CHECKS (TIME & MEMORY CAP)
                            // ----------------------------------------------------
                            if (performance.now() - globalStartTime > this.BUDGETS.MAX_TIME_MS) {
                                stateManager.addWarning(`Safety Limit: Execution timeout exceeded (>15s). Skipping ${pass.name}.`);
                                stateManager.statistics.skippedPasses++;
                                Bus.emit('pass-end', { id: pass.id, status: 'SKIPPED', stats: null });
                                continue;
                            }
                            
                            if (stateManager.currentNodesCount > this.BUDGETS.MAX_AST_NODES || stateManager.currentNodesCount > (stateManager.originalAstNodesCount * this.BUDGETS.MAX_GROWTH_RATIO)) {
                                stateManager.addWarning(`Safety Limit: AST Growth ceiling reached. Skipping ${pass.name}.`);
                                stateManager.statistics.skippedPasses++;
                                Bus.emit('pass-end', { id: pass.id, status: 'SKIPPED', stats: null });
                                continue;
                            }
                            
                            Bus.emit('pass-start', pass.id);
                            await new Promise(r => setTimeout(r, 10)); // Yield to paint RUNNING state
                            
                            const pluginId = `dyn-pass-${pass.id}`;
                            const passTracker = stateManager.recordPassStart(pass.name);
                            Babel.availablePlugins[pluginId] = pass.toBabelPlugin(stateManager, passTracker);
                            
                            try {
                                const passRes = Babel.transformFromAst(stateManager.currentAst, code, {
                                    ast: true, code: false, plugins: [pluginId]
                                });
                                
                                stateManager.updateCurrentAst(passRes.ast);
                                stateManager.recordPassEnd(passTracker); 
                                stateManager.statistics.successfulPasses++;
                                
                                let status = passTracker.errors.length ? 'FAILED' : (passTracker.warnings.length ? 'WARNING' : 'COMPLETE');
                                Bus.emit('pass-end', { id: pass.id, status, stats: passTracker });
                                totalTime += passTracker.time;
                            } catch(e) {
                                stateManager.statistics.failedPasses++;
                                stateManager.addError(`Pass implementation crashed: ${e.message}`);
                                Bus.emit('pass-end', { id: pass.id, status: 'FAILED', stats: passTracker });
                            }
                        }
                        
                        let isMinify = plan.sequence.some(p => p.id === 'minify');
                        if (isMinify) {
                            Bus.emit('pass-start', 'minify');
                            await new Promise(r => setTimeout(r, 10));
                        }

                        let gStart = performance.now();
                        const finalRes = Babel.transformFromAst(stateManager.currentAst, code, {
                            presets: lang === 'typescript' ? [['typescript', {isTSX: true, allExtensions: true}]] : [],
                            ast: true, code: true, minified: isMinify, comments: false
                        });
                        
                        stateManager.finalize(finalRes.ast);
                        let currentCode = finalRes.code;
                        let genTime = performance.now() - gStart;
                        stateManager.statistics.generationTime += genTime;
                        totalTime += genTime;
                        
                        if (isMinify) {
                            stateManager.statistics.successfulPasses++;
                            Bus.emit('pass-end', { id: 'minify', status: 'COMPLETE', stats: { time: genTime, modifications: 0, deltas: {nodes:0,identifiers:0,literals:0,complexity:0}, warnings: [], errors: [] }});
                        }
                        
                        UI.log(stateManager.generateReport(filename), 'system');
                        resolve({ code: currentCode, astState: stateManager, time: totalTime });
                    } catch(e) { 
                        Bus.emit('compile-error');
                        reject(e); 
                    }
                });
            }
        }

        class EditorEngine {
            constructor() { this.eds = {}; this.isNative = true; }
            async init() {
                if(typeof require === 'undefined') return;
                this.isNative = false;
                return new Promise(res => {
                    try {
                        require.config({paths:{'vs':'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.37.1/min/vs'}});
                        require(['vs/editor/editor.main'], () => {
                            monaco.languages.typescript.typescriptDefaults.setCompilerOptions({jsx:4,target:99,allowNonTsExtensions:true});
                            monaco.editor.defineTheme('cyber', {base:'vs-dark',inherit:true,rules:[],colors:{'editor.background':'#00000000'}});
                            res();
                        }); 
                        setTimeout(res, 3000);
                    } catch(e) {
                        this.isNative = true; res();
                    }
                });
            }
            mount(type, c, name) {
                const edKey = name + '_' + type;
                
                // Clean up stale editor instance to prevent duplications or memory leaks
                if (this.eds[edKey]) {
                    if (typeof this.eds[edKey].dispose === 'function') {
                        this.eds[edKey].dispose();
                    }
                    delete this.eds[edKey];
                }

                // Retrieve the target content to pre-fill the editor 
                const fileData = App.ws.files.get(name);
                const initialContent = fileData ? (type === 'source' ? fileData.content : fileData.output) : '';

                if(this.isNative) {
                    const t = document.createElement('textarea'); 
                    t.className='cyber-input'; 
                    t.style.height='100%'; 
                    t.style.resize='none';
                    
                    // CRITICAL FIX: Set value BEFORE attaching DOM and listeners. 
                    // This prevents browser auto-focus/DOM layout events from accidentally capturing an empty string.
                    t.value = initialContent;
                    
                    if(type!=='source') {
                        t.readOnly = true;
                    } else {
                        const update = () => App.ws.updateContent(name, t.value);
                        t.addEventListener('input', update); 
                        t.addEventListener('change', update); 
                        t.addEventListener('keyup', update);
                        t.addEventListener('paste', () => setTimeout(update, 10)); // Fixed Android Paste
                    }
                    
                    c.appendChild(t); 
                    
                    this.eds[edKey] = { 
                        setValue: v => { t.value = v; }, 
                        getValue: () => t.value, 
                        layout: () => {},
                        dispose: () => { t.remove(); }
                    };
                } else {
                    const ed = monaco.editor.create(c, {
                        theme:'cyber',
                        fontFamily:'var(--font-mono)',
                        fontSize:13,
                        readOnly: type!=='source',
                        automaticLayout:true,
                        // Provide value strictly during initialization
                        value: initialContent 
                    });
                    
                    if(type==='source') {
                        // Register listener strictly after the editor confirms construction 
                        ed.onDidChangeModelContent(() => {
                            App.ws.updateContent(name, ed.getValue());
                        });
                    }
                    this.eds[edKey] = ed;

        class AppLayout {

                    init(p){ const t=document.getElementById(htmlId); if(t){ this.el.appendChild(t.content.cloneNode(true)); } if(cb) cb(this.el, p); }
                    layout(w,h){ if(cb && cb.layout) cb.layout(w,h); }
                };

                this.dv.addRegistry({
                    'explorer': mp('explorer','tpl-explorer', e=>App.explorer.init(e)),
                    'pipeline': mp('pipeline','tpl-pipeline', e=>App.pipeline.render(e)),
                    'dash': mp('dash','tpl-dashboard', e=>App.dash.init(e)),
                    'analysis': mp('analysis','tpl-analysis', e=>Analysis.init(e)),

                    'term': mp('term',null, e=>App.term.mount(e)),
                    'editor': class {

                            const outC = document.createElement('div'); outC.style.cssText='flex:1;';
                            edC.appendChild(srcC); edC.appendChild(outC); this.el.appendChild(edC);
                            
                            App.editor.mount('source', srcC, this.name); 
                            App.editor.mount('output', outC, this.name);
                            
                            // Free memory / close editors safely when the specific tab in Dockview is closed
                            if (p.api && p.api.onDidClose) {
                                p.api.onDidClose(() => {
                                    const srcKey = this.name + '_source';
                                    const outKey = this.name + '_output';
                                    if(App.editor.eds[srcKey]?.dispose) App.editor.eds[srcKey].dispose();
                                    if(App.editor.eds[outKey]?.dispose) App.editor.eds[outKey].dispose();
                                    delete App.editor.eds[srcKey];
                                    delete App.editor.eds[outKey];
                                });
                            }
                        }
                        layout(w,h) { 
                            if(App.editor.eds[this.name+'_source'] && App.editor.eds[this.name+'_source'].layout) App.editor.eds[this.name+'_source'].layout({width:w/2,height:h}); 
                            if(App.editor.eds[this.name+'_output'] && App.editor.eds[this.name+'_output'].layout) App.editor.eds[this.name+'_output'].layout({width:w/2,height:h});

                const pExp = this.dv.addPanel({id:'explorer', component:'explorer', title:'Workspace'});

                const pDash = this.dv.addPanel({id:'dash', component:'dash', title:'DASHBOARD'});
                this.dv.addPanel({id:'analysis', component:'analysis', title:'BUILD ANALYSIS', position:{referencePanel:pDash, direction:'right'}});
                const pTerm = this.dv.addPanel({id:'term', component:'term', title:'Terminal', position:{referencePanel:pDash, direction:'below'}});
                setTimeout(()=>{ if(pExp.api) pExp.api.setSize({width:300}); if(pTerm.api) pTerm.api.setSize({height:200}); }, 50);

            buildFallback() { 
                this.c.innerHTML = `
                    <div style="display:flex; flex-direction:column; height:100%; width:100%; overflow-y:auto; background:var(--bg-root);">

                            if(App.editor.eds[prevName+'_output']?.dispose) App.editor.eds[prevName+'_output'].dispose();

                if(this.dv) {

                        document.getElementById('foot-file').innerText = 'No File Selected';

                    if(App.editor.eds[name+'_source']?.dispose) App.editor.eds[name+'_source'].dispose();
                    if(App.editor.eds[name+'_output']?.dispose) App.editor.eds[name+'_output'].dispose();
                    delete App.editor.eds[name+'_source'];
                    delete App.editor.eds[name+'_output'];

            openPanel(id) { if(this.dv && !this.dv.getPanel(id)) this.dv.addPanel({id, component:id, title:id.toUpperCase()}); else if(this.dv) this.dv.getPanel(id).api.setActive(); }

        class TerminalEngine {
            constructor() { 
                try { 
                    if(typeof window.Terminal !== 'undefined') {
                        this.term = new window.Terminal({theme:{background:'transparent',foreground:'#f8fafc'},fontFamily:'Fira Code',fontSize:13,disableStdin:true}); 
                        this.fit = window.FitAddon ? new window.FitAddon.FitAddon() : null; 
                        if(this.fit) this.term.loadAddon(this.fit); 
                    } else {
                        this.term = null;
                    }
                } catch(e){ this.term = null; } 
            }
            mount(c) { 
                if(!this.term) { c.innerHTML=`<textarea id="fb-term" class="cyber-input" style="height:100%;resize:none;" readonly></textarea>`; return; } 
                this.term.open(c); setTimeout(()=>this.fit?.fit(),100); 
            }
            log(msg, t='info') {
                const d = new Date().toLocaleTimeString('en-US',{hour12:false});
                if(!this.term) { 
                    const e=document.getElementById('fb-term'); 
                    if(e){ e.value+=`[${d}] [${t.toUpperCase()}] ${msg}\n`; e.scrollTop=e.scrollHeight;} 
                    return;
                }
                const c = {system:'\x1b[36m',success:'\x1b[32m',error:'\x1b[31;1m',warn:'\x1b[33m',info:'\x1b[37m'};
                msg.split('\n').forEach(l=>this.term.writeln(`\x1b[90m[${d}]\x1b[0m ${c[t]||''}${l}\x1b[0m`));
            }
        }

        const Explorer = {
